name: sas_garments_mobile
description: SAS Garments – Mobile POS & Management App
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.4.3+1

  # Navigation
  go_router: ^13.2.0

  # Local / secure storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Firebase
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.4

  # Charts
  fl_chart: ^0.68.0

  # Scanner (QR + barcode)
  mobile_scanner: ^5.1.1


  # Images
  cached_network_image: ^3.3.1

  # UI helpers
  shimmer: ^3.0.0
  intl: ^0.19.0

  # Biometric
  local_auth: ^2.3.0

  # Connectivity
  connectivity_plus: ^6.0.3

  # Utilities
  uuid: ^4.4.0
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0
  freezed: ^2.5.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
