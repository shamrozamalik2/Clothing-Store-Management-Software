org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable Kotlin incremental compilation — avoids "different roots" crash on
# Windows when project (D:) and Pub cache (C:) are on different drives.
kotlin.incremental=false
# Disable daemon so no stale state survives between builds
org.gradle.daemon=false
# Single-worker DEX merging avoids race conditions on Windows
android.dexOptions.preDexLibraries=false
