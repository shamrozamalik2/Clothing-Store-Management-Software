# ─────────────────────────────────────────────────────────────────
# Nginx config for the ProBusinessCloud web front end
# Place at: /etc/nginx/sites-available/probusinesscloud
# Enable:   sudo ln -s /etc/nginx/sites-available/probusinesscloud /etc/nginx/sites-enabled/
# SSL:      sudo certbot --nginx -d probusinesscloud.com -d www.probusinesscloud.com
#
# Serves the Vite build in frontend/dist, which now contains PRERENDERED HTML
# for each public marketing route (/platform/index.html, /demo/index.html, …).
# Those files carry per-page <title>, description, Open Graph and canonical
# tags so crawlers and social unfurlers get correct previews without running
# JavaScript.
#
# The try_files order below matters:
#   $uri              -> a real file (assets, sitemap.xml, robots.txt)
#   $uri/index.html   -> the PRERENDERED page for this route
#   /index.html       -> SPA fallback for anything else (app routes)
# ─────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name probusinesscloud.com www.probusinesscloud.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name probusinesscloud.com www.probusinesscloud.com;

    root /var/www/sas-garments/frontend/dist;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/probusinesscloud.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/probusinesscloud.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # ── Hashed build assets — safe to cache hard ──────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Crawl files ───────────────────────────────────────────────
    location = /robots.txt  { expires 1d; try_files $uri =404; }
    location = /sitemap.xml { expires 1d; try_files $uri =404; }

    # ── API proxy ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }

    location /uploads/ {
        alias /var/www/sas-garments/uploads/;
        expires 1d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Super-admin portal (separate SPA, still hash-routed) ──────
    location /admin/ {
        alias /var/www/sas-garments/admin/dist/;
        try_files $uri $uri/ /admin/dist/index.html;
    }

    # ── Everything else: prerendered page, else SPA fallback ──────
    # HTML itself must not be cached hard, or visitors keep stale markup
    # after a deploy while the hashed assets underneath have changed.
    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
